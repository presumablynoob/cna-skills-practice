<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNA Skills Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2421;--mute:#68716c;--line:#e2ded5;--acc:#1f6f5c;--acc2:#e7f2ee;--bad:#b3412f;--bad2:#fbeae6;--warn:#a0730d;--warn2:#fbf3dc;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1d2321;--ink:#e9ece9;--mute:#9aa49f;--line:#2e3633;--acc:#5fc2a5;--acc2:#1e3530;--bad:#ef8b77;--bad2:#3a2420;--warn:#e3b54a;--warn2:#3a301a;}}
:root[data-theme="dark"]{--bg:#141816;--card:#1d2321;--ink:#e9ece9;--mute:#9aa49f;--line:#2e3633;--acc:#5fc2a5;--acc2:#1e3530;--bad:#ef8b77;--bad2:#3a2420;--warn:#e3b54a;--warn2:#3a301a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:28px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
#prov{margin:0 0 16px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:500}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button.b{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.b:disabled{opacity:.45;cursor:default}
h2{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:14px 0 6px}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--card);text-align:left;font:inherit;color:var(--ink);width:100%}
.item:hover{border-color:var(--acc)}
.item .n{min-width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.item.drag{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.item.drag:active,.item.dragging{cursor:grabbing}
.item.dragging{border-color:var(--acc);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
/* invisible 44x44 touch target around the 24px handle */
.grip::after{content:"";position:absolute;inset:-10px}
.grip:active{cursor:grabbing}
.item.sel{background:var(--acc2);border-color:var(--acc)}
.item.ok{background:var(--acc2);border-color:var(--acc)}
.item.no{background:var(--bad2);border-color:var(--bad)}
.item .n.wrong{color:var(--bad);background:transparent;box-shadow:inset 0 0 0 1px var(--bad)}
.item.miss{background:var(--warn2);border-color:var(--warn)}
.qtype+h2{margin-top:0}
.qtype{display:inline-block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--acc);background:var(--acc2);border:1px solid var(--acc);padding:3px 11px;border-radius:999px;margin:0 0 10px}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--bad2);color:var(--bad);margin-left:6px;white-space:nowrap}
.score{font-weight:600;margin:10px 0}
.opt{margin:6px 0}
.vh{font-family:Fraunces,serif;font-weight:600;font-size:15px;margin:18px 0 8px}
.vid{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcred{color:var(--mute);font-size:12px;margin:8px 0 16px}
.vcred a{color:var(--acc)}
.ctl{margin-bottom:14px}
.ctl select{max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.seg .sb{font:inherit;font-size:13px;font-weight:500;padding:5px 15px;border:0;background:transparent;color:var(--mute);cursor:pointer}
.seg .sb.on{background:var(--acc);color:#fff}
.revl.focus{margin:12px 0 18px}
.revl.focus li{margin:8px 0}
.rev{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}
.rev summary{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev summary::before{content:"▸";color:var(--mute);flex:none}
.rev[open] summary::before{content:"▾"}
.rev[open] summary{border-bottom:1px solid var(--line)}
.cnt{color:var(--mute);font-size:12px}
.revl{margin:10px 0;padding-left:32px}
.revl li{margin:5px 0}
.foot{color:var(--mute);font-size:12px;margin-top:24px}
.foot a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<h1>CNA Skills Practice</h1>
<p class="sub" id="sub"></p>
<div class="seg" id="prov"></div>
<div class="tabs" id="tabs"></div>
<div class="card" id="app"></div>
<p class="foot" id="foot"></p>
</div>

 credentia:{

  skills:[
["Hand Hygiene (Hand Washing)",[["Address client by name and introduces self to client by name."],["Turns on water at sink."],["Wets hands and wrists thoroughly."],["Applies soap to hands."],["Lathers all surfaces of wrists, hands, and fingers producing friction, for at least 20 (twenty) seconds, keeping hands lower than the elbows and the fingertips down.",1],["Cleans fingernails by rubbing fingertips against palms of the opposite hand."],["Rinse all surfaces of wrists, hands, and fingers, keeping hands lower than the elbows and the fingertips down.",1],["Uses clean, dry paper towel/towels to dry all surfaces of fingers, hands, and wrists starting at fingertips then disposes of paper towel/towels into waste container."],["Uses clean, dry paper towel/towels to turn off faucet then disposes of paper towel/towels into waste container or uses knee/foot control to turn off faucet."],["Does not touch inside of sink at any time."]]],
["Applies One Knee-High Elastic Stocking",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Client is in supine position (lying down in bed) while stocking is applied."],["Turns stocking inside-out, at least to the heel."],["Places foot of stocking over toes, foot, and heel."],["Pulls top of stocking over foot, heel, and leg."],["Moves foot and leg gently and naturally, avoiding force and over-extension of limb and joints."],["Finishes procedure with no twists or wrinkles and heel of stocking, if present, is over heel and opening in toe area (if present) is either over or under toe area; if using a mannequin, candidate may state stocking needs to be wrinkle-free.",1],["Signaling device is within reach and bed is in low position."],["After completing skill, wash hands."]]],
["Assists to Ambulate Using Transfer Belt",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before assisting to stand, client is wearing non-skid shoes/footwear.",1],["Before assisting to stand, bed is at a safe level."],["Before assisting to stand, checks and/or locks bed wheels."],["Before assisting to stand, client is assisted to sitting position with feet flat on the floor.",1],["Before assisting to stand, applies transfer belt securely at the waist over clothing/gown."],["Before assisting to stand, provides instructions to enable client to assist in standing including prearranged signal to alert client to begin standing."],["Stands facing client positioning self to ensure safety of candidate and client during transfer. Counts to three (or says other prearranged signal) to alert client to begin standing."],["On signal, gradually assists client to stand by grasping transfer belt on both sides with an upward grasp (candidate’s hands are in upward position) and maintaining stability of client’s legs by standing knee to knee, or toe to toe with client."],["Walks slightly behind and to one side of client for a distance of ten (10) feet, while holding onto the belt."],["Assists client to bed and removes transfer belt"],["Signaling device is within reach and bed is in low position."],["After completing skill, wash hands."]]],
["Assists With Use of Bedpan",[["Explains procedure speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before placing bedpan, lowers head of bed."],["Puts on clean gloves before placing bedpan under client."],["Places bedpan correctly under client’s buttocks."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["After positioning client on bedpan and removing gloves, raises head of bed."],["Toilet tissue is within reach."],["Hand wipe is within reach and client is instructed to clean hands with hand wipe when finished."],["Signaling device within reach and client is asked to signal when finished."],["Puts on clean gloves before removing bedpan."],["Lowers head of bed before bedpan is removed."],["Ensures client is covered except when placing and removing bedpan."],["Empties and rinses bedpan and pours rinse into toilet."],["Places bedpan in designated dirty supply area."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Signaling device is within reach and bed is in low position."]]],
["Cleans Upper or Lower Denture",[["Puts on clean gloves before handling denture."],["Lines bottom of sink and/or partially fills sink with water before denture is held over sink."],["Rinses denture in moderate temperature running water before brushing them."],["Applies denture toothpaste to toothbrush."],["Brushes all surfaces of denture."],["Rinses all surfaces of denture under moderate temperature running water."],["Rinses denture cup and lid."],["Places denture in denture cup with moderate temperature water/solution and places lid on cup."],["Rinses toothbrush and places in designated toothbrush basin/container."],["Maintains clean technique with placement of toothbrush and denture."],["Appropriately removes and disposes of sink liner and/or drains sink."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."]]],
["Counts and Records Radial Pulse",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Places fingertips on thumb side of client’s wrist to locate radial pulse."],["Count beats for one full minute."],["Signaling device is within reach."],["Before recording, washes hands."],["Records pulse rate within plus or minus 4 beats of evaluator’s reading.",1]]],
["Counts and Records Respirations",[["Explains procedure (for testing purposes), speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Counts respirations for one full minute."],["Signaling device is within reach."],["Before recording, washes hands."],["Records respiration rate within plus or minus 2 breaths of evaluator’s reading.",1]]],
["Donning And Removing PPE (Gown and Gloves)",[["Picks up gown and unfolds."],["Facing the back opening of the gown places arms through each sleeve."],["Fastens the neck opening."],["Secures gown at waist making sure that back of clothing is covered by gown (as much as possible)."],["Puts on gloves."],["Cuffs of gloves overlap cuffs of gown."],["Before removing gown, with one gloved hand, grasps the other glove at the palm, remove glove.",1],["Slips fingers from ungloved hand underneath cuff of remaining glove at wrist, and removes glove turning it inside out as it is removed.",1],["Disposes of gloves into designated waste container without contaminating self."],["After removing gloves, unfastens gown at waist and neck."],["After removing gloves, removes gown without touching outside of gown."],["While removing gown, holds gown away from body without touching the floor, turns gown inward and keeps it inside out."],["Disposes of gown in designated container without contaminating self."],["After completing skill, washes hands."]]],
["Dresses Client with Affected (Weak) Right Arm",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Asks which shirt he/she would like to wear and dresses him/ her in shirt of choice."],["Avoids overexposure of client by ensuring client’s chest is covered."],["Removes gown from the left (unaffected) side first, then removes gown from the right (affected/weak) side."],["Before dressing client, disposes of gown into soiled linen container."],["Assists to put the right (affected/weak) arm through the right sleeve of the shirt before placing garment on left (unaffected) arm.",1],["While putting on shirt, moves body gently and naturally, avoiding force and over-extension of limbs and joints."],["Finishes with clothing in place."],["Signaling device is within reach and bed is in low position."],["After completing skill, washes hands."]]],
["Feeds Client Who Cannot Feed Self",[["Explains procedure to client, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Before feeding, looks at name card on tray and asks client to state name."],["Before feeding client, client is in an upright sitting position (75-90 degrees).",1],["Places tray where the food can be easily seen by client."],["Cleans client’s hands before beginning feeding."],["Sits in a chair facing client during feeding."],["Tells client what foods and beverage are on tray"],["Asks client what he/she would like to eat first."],["Using spoon, offers client one bite of each type of food on tray, telling client the content of each spoonful."],["Offers beverage at least once during meal."],["Candidate asks client if they are ready for next bite of food or sip of beverage."],["At end of meal, candidate cleans client’s mouth and hands."],["Removes food tray."],["Leaves client in upright sitting position (75-90 degrees) with Signaling device within client’s reach."],["After completing skill, washes hands."]]],
["Gives Modified Bed Bath (Face and One Arm, Hand and Underarm)",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Removes gown and places directly in soiled linen container while ensuring client’s chest and lower body is covered."],["Before washing, checks water temperature for safety and comfort and asks client to verify comfort of water."],["Puts on clean gloves before washing client."],["Beginning with eyes, washes eyes with wet washcloth (no soap), using a different area of the washcloth for each stroke, washing inner aspect to outer aspect then proceeds to wash face.",1],["Dries face with dry cloth towel/washcloth."],["Exposes one arm and places cloth towel underneath arm."],["Applies soap to wet washcloth."],["Washes fingers (including fingernails), hand, arm, and underarm keeping rest of body covered."],["Rinses and dries fingers, hand, arm, and underarm."],["Moves body gently and naturally, avoiding force and overextension of limbs and joints."],["Puts clean gown on client."],["Empties, rinses, and dries basin."],["Places basin in designated dirty supply area."],["Disposes of linen into soiled linen container."],["Avoids contact between candidate clothing and used linens."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Signaling device is within reach and bed is in low position."]]],
["Measures and Records Electronic Blood Pressure",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Verifies client assumes a comfortable lying or sitting position."],["Client’s arm is positioned at level of heart with palm up and upper arm is exposed."],["Selects appropriate cuff size."],["Feels for brachial artery on inner aspect of arm, at bend of elbow."],["Places blood pressure cuff snugly on client’s upper arm and sensor/arrow is over the brachial artery site."],["Turns on the machine and ensures device is functioning. If the machine has different settings for infants, children, and adults, selects the appropriate setting."],["Pushes start button. If cuff inflates to more than 200 mm Hg then stops machine and uses cuff on client’s other arm."],["Waits until the blood pressure reading appears on the screen and for the cuff to deflate, then removes the cuff."],["Signaling device is within reach."],["Before recording, washes hands."],["After obtaining reading using Blood Pressure cuff, records both systolic and diastolic pressures exactly as displayed on the digital screen.",1]]],
["Measures and Records Urinary Output",[["Puts on clean gloves before handling bedpan."],["Pours the contents of the bedpan into measuring container without spilling or splashing urine outside of container."],["Rinses bedpan and pours rinse into toilet."],["Measures the amount of urine at eye level with container on flat surface (if between measurement lines, round up to nearest 25 ml/cc)."],["After measuring urine, empties contents of measuring container into toilet."],["Rinses measuring container and pours rinse into toilet."],["Before recording output, removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Records contents of container within plus or minus 25 ml/cc of evaluator’s reading.",1]]],
["Measures and Records Weight of Ambulatory Client",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Client has non-skid shoes/footwear on before walking to scale."],["Before client steps on scale, candidate sets scale to zero."],["Asks client to step on center of scale and obtains client’s weight."],["Asks client to step off scale."],["Before recording, washes hands."],["Records weight based on indicator on scale. Weight is within plus or minus 2 lbs of evaluator’s reading (If weight recorded in kg weight is within plus or minus 0.9 kg of evaluator’s reading).",1]]],
["Performs Modified Passive Range of Motion (Prom) for One Knee and One Ankle",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Ensures that client is supine in bed and instructs client to inform candidate if pain is experienced during exercise."],["While supporting the leg at knee and ankle, bends the knee and then returns leg to client’s normal position (flexion/extension) (AT LEAST 3 TIMES unless pain is verbalized). Moves joints gently, slowly and smoothly through the range of motion, discontinuing exercise if client verbalizes pain.",1],["While supporting the foot and ankle close to the bed, pushes/pulls foot toward head (dorsiflexion), and pushes/ pulls foot down, toes point down (plantar flexion) (AT LEAST 3 TIMES unless pain is verbalized). Moves joints gently, slowly and smoothly through the range of motion, discontinuing exercise if client verbalizes pain.",1],["Signaling device is within reach and bed is in low position."],["After completing skill, washes hands."]]],
["Performs Modified Passive Range of Motion (Prom for One Shoulder)",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Instructs client to inform candidate if pain experienced during exercise."],["While supporting arm at the elbow and at the wrist, raises client’s straightened arm from side position upward toward head to ear level and returns arm down to side of body (flexion/extension) (AT LEAST 3 TIMES unless pain is verbalized). Moves joint gently, slowly and smoothly through the range of motion, discontinuing exercise if client verbalizes pain.",1],["While supporting arm at the elbow and at the wrist, moves client’s straightened arm away from the side of body to shoulder level and returns to side of body (abduction/adduction) (AT LEAST 3 TIMES unless pain is verbalized). Moves joint gently, slowly and smoothly through the range of motion, discontinuing exercise if client verbalizes pain.",1],["Signaling device is within reach and bed is in low position."],["After completing skill, washes hands."]]],
["Positions On Side",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before turning, lowers head of bed."],["Raises side rail on side to which body will be turned."],["Candidate assists client to slowly roll onto side toward raised side rail."],["Places or adjusts pillow under head for support."],["Candidate repositions arm and shoulder so that client is not lying on arm."],["Supports top arm with supportive device."],["Places supportive device behind client’s back."],["Places supportive device between legs with top knee flexed; knee and ankle supported."],["Signaling device is within reach and bed is in low position."],["After completing skill, washes hands"]]],
["Provides Catheter Care for Female",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before washing, checks water temperature for safety and comfort and asks client to verify comfort of water."],["Puts on clean gloves before washing."],["Places linen protector under perineal area including buttocks before washing."],["Exposes area surrounding catheter (only exposing client between hip and knee)."],["Applies soap to wet washcloth."],["While holding catheter at meatus without tugging, cleans at least four inches of catheter from meatus, moving in only one direction, away from meatus, using a clean area of the washcloth for each stroke.",1],["While holding catheter at meatus without tugging, using a clean washcloth, rinses at least four (4) inches of catheter from meatus, moving only in one direction, away from meatus, using a clean area of the washcloth for each stroke.",1],["While holding catheter at meatus without tugging, dries at least four (4) inches of catheter moving away from meatus using a dry cloth towel/washcloth."],["Empties, rinses, and dries basin."],["Places basin in designated dirty supply area."],["Disposes of used linen into soiled linen container and disposes of linen protector appropriately."],["Avoids contact between candidate clothing and used linen."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Signaling device is within reach and bed is in low position."]]],
["Provides Foot Care on One Foot",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before washing, checks water temperature for safety and comfort and asks client to verify comfort of water."],["Basin is in a comfortable position for client and on protective barrier."],["Puts on clean gloves before washing foot."],["Client’s bare foot is placed into the water."],["Applies soap to wet washcloth."],["Lifts foot from water and washes foot (including between the toes)."],["Foot is rinsed (including between the toes)."],["Dries foot (including between the toes) with dry cloth towel/washcloth."],["Applies lotion to top and bottom of foot (excluding between the toes) removing excess with a towel/washcloth."],["Supports foot and ankle during procedure."],["Empties, rinses, and dries basin."],["Places basin in designated dirty supply area."],["Disposes of used linen into soiled linen container."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Signaling device is within reach."]]],
["Provides Mouth Care",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before providing mouth care, client is in upright sitting position (75-90 degrees)."],["Puts on clean gloves before cleaning mouth."],["Places cloth towel across chest before providing mouth care."],["Secures cup of water and moistens toothbrush."],["Before cleaning mouth, applies toothpaste to moistened toothbrush."],["Cleans mouth (including tongue and all surfaces of teeth), using gentle motions.",1],["Maintains clean technique with placement of toothbrush."],["Candidate holds emesis basin to chin while client rinses mouth."],["Candidate wipes mouth and removes clothing protector."],["Disposes of used linen into soiled linen container."],["Rinses toothbrush and empties, rinses, and dries basin."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Signaling device is within reach and bed is in low position."]]],
["Provides Perineal Care (Peri-Care) for Female",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before washing, checks water temperature for safety and comfort and asks client to verify comfort of water."],["Puts on clean gloves before washing perineal area."],["Places pad/ linen protector under perineal area including buttocks before washing."],["Exposes perineal area (only exposing between hips and knees)."],["Applies soap to wet washcloth."],["Washes genital area, moving from front to back, while using a clean area of the washcloth for each stroke.",1],["Using clean washcloth, rinses soap from genital area, moving from front to back, while using a clean area of the washcloth for each stroke.",1],["Dries genital area moving from front to back with dry cloth towel/washcloth."],["After washing genital area, turns to side, then washes rectal area moving from front to back using a clean area of washcloth for each stroke."],["Using clean washcloth, rinses soap from rectal area, moving from front to back, while using a clean area of the washcloth for each stroke."],["Dries rectal area moving from front to back with dry cloth towel/washcloth."],["Repositions client."],["Empties, rinses, and dries basin."],["Places basin in designated dirty supply area."],["Disposes of used linen into soiled linen container and disposes of linen protector appropriately."],["Avoids contact between candidate clothing and used linen."],["Removes and disposes of gloves (without contaminating self) into waste container and washes hands."],["Signaling device is within reach and bed is in low position"]]],
["Transfers from Bed to Wheelchair Using Transfer Belt",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Provides Privacy with a curtain, screen, or door."],["Before assisting to stand, wheelchair is positioned alongside of bed, at head of bed facing foot or foot of bed facing head."],["Before assisting to stand, footrests are folded up or removed."],["Before assisting to stand, locks wheels on wheelchair.",1],["Before assisting to stand, bed is at a safe level."],["Before assisting to stand, checks and/or locks bed wheels."],["Before assisting to stand, client is assisted to a sitting position with feet flat on the floor.",1],["Before assisting to stand, client is wearing shoes."],["Before assisting to stand, applies transfer belt securely at the waist over clothing/gown."],["Before assisting to stand, provides instructions to enable client to assist in transfer including prearranged signal to alert when to begin standing."],["Stands facing client positioning self to ensure safety of candidate and client during transfer. Counts to three (or says other prearranged signal) to alert client to begin standing."],["On signal, gradually assists client to stand by grasping transfer belt on both sides with an upward grasp (candidate’s hands are in upward position) and maintaining stability of client’s legs by standing knee to knee, or toe to toe with the client."],["Assists client to turn to stand in front of wheelchair with back of client’s legs against wheelchair."],["Lowers client into wheelchair."],["Positions client with hips touching back of wheelchair and transfer belt is removed."],["Positions feet on footrests."],["Signaling device is within reach."],["After completing skill, washes hands"]]],
["Measures and Records Manual Blood Pressure",[["Explains procedure, speaking clearly, slowly, and directly, maintaining face-to-face contact whenever possible."],["Before using stethoscope, wipes bell/diaphragm and earpieces of stethoscope with alcohol."],["Client’s arm is positioned with palm up and upper arm is exposed."],["Feels for brachial artery on inner aspect of arm, at bend of elbow."],["Places blood pressure cuff snugly on client’s upper arm, with sensor/arrow over brachial artery site."],["Earpieces of stethoscope are in ears and bell/diaphragm is over brachial artery site."],["Candidate inflates cuff between 160mm Hg to 180 mm Hg. If beat heard immediately upon cuff deflation, completely deflate cuff. Re-inflate cuff to no more than 200 mm Hg."],["Deflates cuff slowly and notes the first sound (systolic reading), and last sound (diastolic reading) (If rounding needed, measurements are rounded UP to the nearest 2 mm of mercury)."],["Removes cuff."],["Signaling device is within reach."],["Before recording, washes hands."],["After obtaining reading using BP cuff and stethoscope, records both systolic and diastolic pressures each within plus or minus 8 mm of evaluator’s reading.",1]]]
  ]},
 headmaster:{

  skills:[
["APPLY A KNEE-HIGH ANTI-EMBOLIC (ELASTIC) STOCKING TO ONE LEG",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Raise bed height."],["Provide for the resident’s privacy."],["Provide for the resident's privacy by only exposing one leg."],["Roll, gather, or turn the stocking down inside out to at least the heel."],["Place the foot of the stocking over the resident's toes, foot, and heel."],["Roll -or- pull the top of the stocking over the resident’s foot, heel, and up the leg."],["Check toes for possible pressure from the stocking."],["Adjust stocking as needed."],["Leave the resident with a stocking that is smooth/wrinkle-free.",1],["Lower bed."],["Place the call light or signal calling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["ASSIST A DEPENDENT RESIDENT WITH A MEAL IN BED",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Ask the resident to state their name and verify that their name matches the name on the diet card."],["Position the resident in an upright, sitting position BEFORE feeding. At least 75-90 degrees.",1],["Protect clothing from soiling using a napkin, a clothing protector, or a towel."],["Provide hand hygiene for the resident BEFORE feeding. (Candidate may use a disposable wipe and dispose of it in the trash can, or wash the resident’s hands with soap and a wet washcloth, or they may rub hand sanitizer over all surfaces of the resident’s hands until dry.)"],["Ensure the resident's hands are dry BEFORE feeding. (If a wet washcloth with soap was used, the candidate must dry the resident’s hands. If a disposable wipe or hand sanitizer was used, ensure hands are dry.)"],["Place soiled linen in a designated laundry hamper, or dispose of it in an appropriate container."],["Sit in a chair, facing the resident, while feeding the resident."],["Describe the food and fluid being offered to the resident."],["Offer each fluid frequently."],["Offer small amounts of food at a reasonable rate."],["Allow resident time to chew and swallow."],["Wipe the resident's hands and mouth AFTER the feeding demonstration."],["Remove the clothing protector and place it in a designated laundry hamper. If a napkin, dispose of it in the trash container."],["Leave the resident sitting upright in bed with the head of the bed set up to at least 75-90 degrees."],["Record intake as a percentage of total solid food eaten on the previously signed recording form."],["Candidate's calculation must be within 25 percentage points of the RN Test Observer’s.",1],["Record estimated intake as the sum total fluid consumed in mLs on the previously signed recording form."],["Candidate's calculation must be within 30mLs of the RN Test Observer's.",1],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["ASSIST A RESIDENT TO AMBULATE USING A GAIT BELT",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Obtain a gait belt for the resident."],["Assist the resident in putting on non-skid shoes/footwear."],["Adjust the bed height to ensure that the resident’s feet are flat on the floor when the resident is sitting on the edge of the bed."],["Lock the bed brakes to ensure the resident's safety.",1],["Lock the wheelchair brakes to ensure the resident’s safety.",1],["Bring the resident to a sitting position."],["Place the gait belt around the resident’s waist to stabilize the trunk."],["Tighten the gait belt."],["Check the gait belt for tightness by slipping fingers between the gait belt and the resident."],["Face the resident."],["Grasp the gait belt on both sides with an upward grasp."],["Bring the resident to a standing position."],["Stabilize the resident."],["Ambulate the resident at least 10 steps to the wheelchair."],["Assist the resident to pivot/turn and sit the resident in the wheelchair in a controlled manner that ensures safety."],["Use proper body mechanics at all times."],["Remove the gait belt."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["ASSIST THE RESIDENT WITH THE USE OF A BEDPAN, MEASURE AND RECORD URINE OUTPUT, WITH HAND WASHING (ONE OF THE POSSIBLE MANDATORY FIRST TASKS)",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Put on gloves."],["Position the resident on the bedpan safely and correctly. (Pan is not upside down, it is centered, etc.)"],["Raise the head of the bed to a comfortable level."],["Leave tissue within reach of the resident."],["Leave the call light or signaling device within reach of the resident."],["Step behind the privacy curtain to provide privacy for the resident."],["When the RN Test Observer indicates, the candidate returns."],["Lower the head of the bed."],["Gently remove the bedpan."],["Hold the bedpan for the RN Test Observer while an unknown quantity of liquid is poured into the bedpan."],["Place the graduate on a level, flat surface."],["Pour bedpan contents into the graduate."],["With the graduate at eye level, measure output."],["Empty the equipment into the designated toilet/commode."],["Rinse the equipment used and empty the rinse water into the designated toilet/commode. Return equipment to storage."],["Wash/assist resident to wash and dry hands with soap and water."],["Place soiled linen in a designated laundry hamper."],["Remove gloves, turning them inside out as they are removed, and dispose of them in the trash container."],["Record output in mLs on the previously signed recording form."],["Candidate's recorded measurement is within 25mLs of RN Test Observer's reading.",1],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Turn on the water."],["Wet hands and wrists thoroughly."],["Apply soap to hands."],["Rub hands together using friction with soap."],["Scrub/wash hands together for at least twenty (20) seconds with soap.",1],["Scrub/wash with interlaced fingers pointing downward with soap."],["Wash all surfaces of hands with soap."],["Wash wrists with soap."],["Clean fingernails by rubbing fingertips against the palm of the opposite hand."],["Rinse fingers, hands, and wrists thoroughly under running water with fingers pointed downward."],["Starting at the fingertips, dry fingers, hands, and wrists on clean paper towel(s)."],["Discard paper towels in the trash container as used."],["Turn off the faucet with a clean, dry paper towel and discard the paper towel in the trash container as used."],["Do not re-contaminate hands at any time during the hand washing procedure. (Such as touching the sides of the sink during the procedure or crumpling up the paper towel used to turn off the faucet with both hands before discarding, etc.)",1]]],
["CATHETER CARE FOR A FEMALE RESIDENT WITH HAND WASHING (ONE OF THE POSSIBLE MANDATORY FIRST TASKS) [DEMONSTRATED ON A MANIKIN]",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Fill a basin with comfortably warm water."],["Put on gloves."],["Expose the area surrounding the catheter, only exposing the resident between the hip and the knee."],["Hold the catheter where it exits the urethra with one hand.",1],["While holding the catheter, clean at least 3-4 inches down the drainage tube."],["Clean with strokes only away from the urethra.",1],["Use a clean portion of the washcloth for each stroke."],["While holding the catheter, rinse at least 3-4 inches down the drainage tube."],["Rinse using strokes only away from the urethra."],["Rinse using a clean portion of the washcloth for each stroke."],["Pat dry, do not air or wipe dry."],["Do not allow the tube to be tugged/pulled at any time during the procedure.",1],["Replace the top cover over the resident."],["Place soiled linen in a designated laundry hamper."],["Empty equipment."],["Rinse equipment."],["Dry equipment."],["Return equipment to storage."],["Remove gloves, turning them inside out as they are removed, and dispose of them in the trash container."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Turn on the water."],["Wet hands and wrists thoroughly."],["Apply soap to hands."],["Rub hands together using friction with soap."],["Scrub/wash hands together for at least twenty (20) seconds with soap.",1],["Scrub/wash with interlaced fingers pointing downward with soap."],["Wash all surfaces of hands with soap. Wash wrists with soap."],["Clean fingernails by rubbing fingertips against the palm of the opposite hand."],["Rinse fingers, hands, and wrists thoroughly under running water with fingers pointed downward."],["Starting at the fingertips, dry fingers, hands, and wrists on clean paper towel(s)."],["Discard paper towels in the trash container as used."],["Turn off the faucet with a clean, dry paper towel and discard the paper towel in the trash container as used."],["Do not re-contaminate hands at any time during the hand washing procedure. (Such as touching the sides of the sink during the procedure or crumpling up the paper towel used to turn off the faucet with both hands before discarding, etc.)",1]]],
["DENTURE CARE – CLEAN AN UPPER OR LOWER DENTURE [ONLY ONE PLATE IS USED FOR TESTING]",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Line the bottom of the sink with a protective lining that would help prevent damage to the dentures. (Towel, washcloth, or paper towels.)",1],["Put on gloves."],["Apply denture cleanser (paste) to denture brush (or toothbrush)."],["Remove the denture from the cup."],["Handle the denture carefully to avoid damage."],["Rinse the denture under cool running water before brushing.",1],["Thoroughly brush the denture inner surfaces."],["Thoroughly brush the denture outer surfaces."],["Thoroughly brush the denture chewing surfaces."],["Rinse all surfaces of the denture under cool running water after brushing."],["Rinse the denture cup and lid."],["Place the denture in the rinsed cup."],["Add cool, clean water to the denture cup and replace the lid on the denture cup."],["Rinse equipment."],["Return equipment to storage."],["Discard sink protective lining in an appropriate container."],["Remove gloves, turning them inside out as they are removed, and dispose of them in the trash container."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."]]],
["DON (PUT ON) A GOWN AND GLOVES, EMPTY A URINARY DRAINAGE BAG, MEASURE AND RECORD URINE OUTPUT, AND DOFF (REMOVE) THE GOWN AND GLOVES WITH HAND WASHING (ONE OF THE POSSIBLE MANDATORY FIRST TASKS)",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Unfold the gown."],["Face the back opening of the gown."],["Place arms through each sleeve."],["Secure the neck opening."],["Secure the gown at the waist, making sure that the back flaps cover clothing as completely as possible."],["Put on gloves."],["Cuffs of the gloves overlap cuffs of the gown."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Place a barrier on the floor under the drainage bag."],["Place the graduate on the previously placed barrier."],["Open the drain to allow the urine to flow into the graduate until the bag is completely empty."],["Avoid touching the graduate with the tip of the tubing."],["Close the drain."],["Wipe the drain with an alcohol wipe AFTER emptying the drainage bag."],["Place the graduate on a level, flat surface."],["With the graduate at eye level, measure output."],["Empty the graduate into the designated toilet/commode."],["Rinse equipment, emptying rinse water into the designated toilet/commode."],["Return equipment to storage."],["Record the output in mLs on the previously signed recording form."],["Candidate's recorded measurement is within 25mLs of the RN Test Observer's measurement.",1],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Remove gloves BEFORE removing gown with one gloved hand grasping the other glove at the palm to remove.",1],["Slip fingers from the ungloved hand underneath the cuff of the remaining glove at the wrist and remove the glove, turning it inside out as it is removed.",1],["Dispose of gloves in the trash container without contaminating self."],["Unfasten the gown at the waist."],["Unfasten the gown at the neck."],["Remove the gown without touching the outside of the gown."],["While removing the gown, hold the gown away from the body without touching the floor."],["While removing the gown, turn the gown inward and keep it inside out."],["Dispose of gown in designated container without contaminating self."],["Turn on the water."],["Wet hands and wrists thoroughly."],["Apply soap to hands."],["Rub hands together using friction with soap."],["Scrub/wash hands together for at least twenty (20) seconds with soap."],["Scrub/wash with interlaced fingers pointing downward with soap."],["Wash all surfaces of hands with soap."],["Wash wrists with soap."],["Clean fingernails by rubbing fingertips against the palm of the opposite hand."],["Rinse fingers, hands, and wrists thoroughly under running water with fingers pointed downward."],["Starting at the fingertips, dry fingers, hands, and wrists on clean paper towel(s)."],["Discard paper towels in the trash container as used."],["Turn off the faucet with a clean, dry paper towel and discard the paper towel in the trash container as used."],["Do not re-contaminate hands at any time during the hand washing procedure. (Such as touching the sides of the sink during the procedure or crumpling up the paper towel used to turn off the faucet with both hands before discarding, etc.)"]]],
["DRESS A RESIDENT WITH AN AFFECTED (WEAK) SIDE",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Raise bed height."],["Keep the resident covered while removing the gown."],["Remove the gown from the unaffected side first."],["Place soiled gown in a designated laundry hamper."],["Dress the resident in a button-up shirt. Insert your hand through the sleeve of the shirt and grasp the hand of the resident."],["When dressing the resident in a button-up shirt, always dress from the affected (weak) side first.",1],["Assist the resident to raise their buttocks or turn the resident from side-to-side and draw the pants over their buttocks and up to the resident's waist."],["When dressing the resident in pants, always dress the affected (weak) side leg first.",1],["Put on the resident's socks. Draw the socks up the resident's foot until they are smooth."],["Leave the resident comfortably/properly dressed (pants pulled up to the waist front and back and shirt completely buttoned)."],["Lower the bed."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["FOOT CARE - ONE FOOT",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Fill a basin with comfortably warm water."],["Remove a sock from the resident’s (left/right) foot. (The scenario read to you will specify right or left.)"],["Immerse the resident’s foot in warm water. a. You MUST verbalize the 5 to 20 minutes soaking time after you begin soaking the foot."],["Use water and a soapy washcloth."],["Wash the entire foot."],["Wash between toes."],["Rinse the entire foot."],["Rinse between toes."],["Dry foot thoroughly."],["Dry thoroughly between toes.",1],["Apply lotion to the top and bottom of the foot."],["Avoid getting lotion between the resident’s toes."],["If any excess lotion is on the foot, wipe with a towel/washcloth."],["Replace the sock on the resident’s foot."],["Empty equipment."],["Rinse equipment."],["Dry equipment."],["Return equipment to storage."],["Placed soiled linens in a designated laundry hamper."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."]]],
["MODIFIED BED BATH – FACE AND ONE ARM, HAND AND UNDERARM",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Raise bed height."],["Cover the resident with a bath blanket."],["Remove the remaining top covers. Fold to the bottom of the bed or place aside."],["Remove the resident's gown without exposing the resident and place the soiled gown in the designated laundry hamper."],["Fill a basin with comfortably warm water."],["Beginning with the eyes, wash the eyes WITHOUT SOAP using a clean portion of the washcloth for each stroke, washing from the inner aspect to the outer aspect.",1],["Wash face WITHOUT SOAP."],["Pat dry face."],["Place a towel under the resident’s arm, exposing one arm."],["Wash arm with soap."],["Wash hand with soap."],["Wash underarm with soap."],["Rinse arm."],["Rinse hand."],["Rinse underarm."],["Pat dry arm."],["Pat dry hand."],["Pat dry the underarm."],["Assist the resident in putting on a clean gown."],["Empty equipment."],["Rinse equipment."],["Dry equipment."],["Return equipment to storage."],["Place soiled linen in a designated laundry hamper."],["Lower bed, if it was raised."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub hands together until hands are completely dry."],["Place call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."]]],
["MOUTH CARE – BRUSH A RESIDENT’S TEETH",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry. Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Drape the resident's chest with a towel to prevent soiling."],["Put on gloves BEFORE cleaning the resident’s mouth."],["Wet the toothbrush and apply a small amount of toothpaste."],["Gently brush the inner surfaces of the resident’s upper and lower teeth."],["Gently brush the outer surfaces of the resident’s upper and lower teeth."],["Gently brush the chewing surfaces of the resident’s upper and lower teeth."],["Gently brush the resident's tongue."],["Assist the resident in rinsing their mouth."],["Wipe the resident's mouth."],["Remove soiled linen."],["Place soiled linen in a designated laundry hamper."],["Empty container. (Container may be an emesis basin or a disposable cup.)"],["Rinse the emesis basin, if used, or discard disposable items in the trash can."],["Dry emesis basin, if used."],["Rinse the toothbrush."],["Return equipment to storage."],["Remove gloves, turning them inside out as they are removed, and dispose of them in the trash container."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."]]],
["PASSIVE RANGE OF MOTION FOR A RESIDENT’S HIP AND ONE KNEE",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry. Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Raise bed height."],["Position the resident supine (bed flat)."],["Correctly support joints at all times by placing one hand under the resident’s knee and the other hand under the resident’s ankle."],["Gently move the resident’s entire leg away from the body. a. Abduction Gently return the resident’s leg toward the body. a. Adduction Gently complete abduction and adduction of the hip at least three times."],["Continue to correctly support joints at all times by placing one hand under the resident’s knee and the other hand under the resident’s ankle."],["Gently bend the resident’s knee and hip toward the resident’s trunk a. Flexion of the hip and knee at the same time Gently straighten the resident’s knee and hip. a. Extension of the hip and knee at the same time Gently complete flexion and extension of the knee and hip at least three times."],["Do not force any joint beyond the point of free movement."],["Candidate must ask at least once during the PROM exercise if there is/was any discomfort/pain.",1],["Lower bed."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["PASSIVE RANGE OF MOTION FOR A RESIDENT’S SHOULDER",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry. Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Raise bed height."],["Position the resident supine (bed flat)."],["Correctly support joints at all times by placing one hand under the resident’s elbow and the other hand under the resident’s wrist."],["Gently raise the resident's straightened arm up and over the resident's head to ear level. a. Flexion Gently bring the resident's arm back down to the side of the resident's body. a. Extension Gently complete flexion and extension of the shoulder at least three times."],["Continue the same support for the shoulder joints by placing one hand under the resident’s elbow and the other hand under the resident’s wrist."],["Gently move the resident's entire arm away from the side of the resident’s body to shoulder level. a. Abduction Gently return the resident’s arm to the side of the resident's body. a. Adduction Gently complete abduction and adduction of the shoulder at least three times."],["Do not force any joint beyond the point of free movement."],["Candidate must ask at least once during the ROM exercise if there is/was any discomfort/pain.",1],["Lower bed."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["PERINEAL CARE FOR A FEMALE RESIDENT WITH HAND WASHING (ONE OF THE POSSIBLE MANDATORY FIRST TASKS) [DEMONSTRATED ON A MANIKIN]",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Fill a basin with comfortably warm water."],["Raise bed height."],["Put on gloves."],["Turn the resident or raise their hips and place a waterproof pad under the resident’s buttocks."],["Expose the perineal area only."],["Separate labia. (It is helpful if you verbalize separating the labia as you demonstrate separating the labia.)"],["Use water and a soapy washcloth (no peri-wash or no rinse soap allowed)."],["Clean one side of the labia from front to back."],["Use a clean portion of the washcloth, and clean the other side of the labia from front to back."],["Use a clean portion of the washcloth, and clean the vaginal area from front to back.",1],["Use a clean washcloth, rinse from one side of the labia from front to back."],["Use a clean portion of the washcloth, rinse the other side of the labia from front to back."],["Use a clean portion of the washcloth, rinse the vaginal area from front to back."],["Pat dry, do not air or wipe dry."],["Assist the resident (manikin) in turning onto the side away from the candidate toward the center of the bed."],["Use a clean washcloth with water and soap (no peri-wash or no rinse soap allowed)."],["Wash from the vagina to the rectal area.",1],["Use a clean portion of the washcloth with any stroke."],["Use a clean washcloth, rinse the rectal area from front to back."],["Use a clean portion of the washcloth with any stroke."],["Pat dry, do not air or wipe dry."],["Safely remove the waterproof pad from under the resident’s buttocks."],["Position the resident (manikin) on its back."],["Place soiled linen in a designated laundry hamper."],["Empty equipment."],["Rinse equipment."],["Dry equipment."],["Return equipment to storage."],["Remove gloves, turning them inside out as they are removed, and dispose of them in the trash container."],["Lower bed."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Turn on the water."],["Wet hands and wrists thoroughly."],["Apply soap to hands."],["Rub hands together using friction with soap."],["Scrub/wash hands together for at least twenty (20) seconds with soap.",1],["Scrub/wash with interlaced fingers pointing downward with soap."],["Wash all surfaces of hands with soap."],["Wash wrists with soap."],["Clean fingernails by rubbing fingertips against the palm of the opposite hand."],["Rinse fingers, hands, and wrists thoroughly under running water with fingers pointed downward."],["Starting at the fingertips, dry fingers, hands, and wrists on clean paper towel(s)."],["Discard paper towels in the trash container as used."],["Turn off the faucet with a clean, dry paper towel and discard the paper towel in the trash container as used."],["Do not re-contaminate hands at any time during the hand washing procedure. (Such as touching the sides of the sink during the procedure or crumpling up the paper towel used to turn off the faucet with both hands before discarding, etc.)",1]]],

["TRANSFER A RESIDENT FROM THEIR BED TO A WHEELCHAIR USING A GAIT BELT",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Provide for the resident’s privacy."],["Obtain a gait belt for the resident."],["Position the wheelchair at the head of the bed or the foot of the bed."],["Assist the resident in putting on non-skid shoes/footwear."],["Adjust the bed height to ensure that the resident’s feet are flat on the floor when the resident is sitting on the edge of the bed."],["Lock the bed brakes to ensure the resident's safety.",1],["Lock the wheelchair brakes to ensure the resident’s safety.",1],["Bring the resident to a sitting position."],["Place a gait belt around the resident’s waist to stabilize the trunk."],["Tighten the gait belt."],["Check the gait belt for tightness by slipping fingers between the gait belt and the resident."],["Face the resident."],["Grasp the gait belt on both sides with an upward grasp."],["Bring the resident to a standing position."],["Assist the resident in pivoting in a controlled manner that ensures safety."],["Lower the resident into the wheelchair in a controlled manner that ensures safety."],["Remove the gait belt."],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],

er all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]],
["VITAL SIGNS: COUNT AND RECORD A RESIDENT’S RADIAL PULSE AND RESPIRATIONS",[["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."],["Explain the procedure to the resident."],["Locate the resident’s radial pulse by placing fingertips on the thumb side of the resident's wrist."],["Count the resident’s radial pulse for one full minute. a. Tell the RN Test Observer when you start counting and tell them when you stop counting."],["Record your radial pulse rate reading on the previously signed recording form."],["Candidate’s recorded radial pulse rate is within 4 beats of RN Test Observer's recorded rate.",1],["Count the resident’s respirations for one full minute. a. Tell the RN Test Observer when you start counting and tell them when you stop counting."],["Record your respirations reading on the previously signed recording form."],["Candidate’s recorded respiratory rate is within 2 breaths of the RN Test Observer's recorded rate.",1],["Place the call light or signaling device within easy reach of the resident."],["Maintain respectful, courteous interpersonal interactions at all times."],["Perform hand hygiene. a. Cover all surfaces of hands with hand sanitizer. b. Rub your hands together until they are completely dry."]]]
  ]}
};
let prov="credentia";
let S=PROV[prov].skills, V=PROV[prov].videos||[];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const app=document.getElementById('app');
const MODES=[["drill","Practice Exam"],["review","Skills"]];
let mode="drill",skill=-1;
let revView="focus",revIdx=0;  // Skills tab: focus one skill, or list them all
const tabs=document.getElementById('tabs');
MODES.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab';b.textContent=l;b.onclick=()=>{mode=k;render()};b.dataset.k=k;tabs.appendChild(b)});
// draw a random skill, never the same one twice running
function nextSkill(){const p=skill;do{skill=Math.random()*S.length|0}while(S.length>1&&skill==p)}
// step practice: random skill, then randomly either ordering or critical steps.
// Skills with no critical steps flagged always get the ordering task, so a round
// is never unanswerable.
function drill(){nextSkill();(S[skill][1].some(s=>s[1])&&Math.random()<.5?crit:order)()}
const provBar=document.getElementById('prov');
Object.keys(PROV).forEach(k=>{const b=document.createElement('button');b.className='sb';b.dataset.p=k;b.textContent=PROV[k].label;b.onclick=()=>setProv(k);provBar.appendChild(b)});
function chrome(){
  const p=PROV[prov];
  [...provBar.children].forEach(b=>b.classList.toggle('on',b.dataset.p===prov));
  document.getElementById('sub').textContent=p.blurb;
  document.getElementById('foot').innerHTML=`Steps are quoted from <a href="${p.src}" target="_blank" rel="noopener noreferrer">${esc(p.srcName)}</a>. ${esc(p.note)} Check the official candidate handbook for your state before the exam.`;
}
function setProv(k){
  if(k===prov)return;
  prov=k;S=PROV[k].skills;V=PROV[k].videos||[];
  skill=-1;revIdx=0;            // the two lists have different skills and lengths
  chrome();render();
}
function render(){[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.k==mode));({drill,review})[mode]()}

function order(){
  const steps=S[skill][1];
  // cur[position] = index of the step currently sitting there
  let cur=shuf(steps.map((_,i)=>i));
  if(steps.length>1&&cur.every((v,i)=>v===i))cur=shuf(cur);
  app.innerHTML=`<p class="qtype">Determine Order</p><h2>${esc(S[skill][0])}</h2><p class="hint">Skill ${skill+1}. Drag the steps into the order you would do them, then submit.</p><div class="list" id="pool"></div><div id="out"></div><div class="row"><button class="b p" id="chk">Submit</button><button class="b" id="again">Reshuffle</button><button class="b" id="new">Next</button></div>`;
  const pool=document.getElementById('pool'),out=document.getElementById('out');
  const renumber=()=>[...pool.children].forEach((c,k)=>c.querySelector('.n').textContent=k+1);
  const sync=()=>{cur=[...pool.children].map(c=>+c.dataset.i)};
  // move the dragged row so its centre lands between its neighbours
  function place(item,y){
    const others=[...pool.children].filter(c=>c!==item);
    const before=others.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
    if(before)pool.insertBefore(item,before);else pool.appendChild(item);
    renumber();
  }
  // start dragging `item`, following the pointer until it is released
  function begin(item){
    item.classList.add('dragging');
    const move=ev=>place(item,ev.clientY);
    const block=ev=>ev.preventDefault();
    const end=()=>{
      item.classList.remove('dragging');
      removeEventListener('pointermove',move);
      removeEventListener('pointerup',end);
      removeEventListener('pointercancel',end);
      removeEventListener('touchmove',block);
      sync();
    };
    addEventListener('pointermove',move);
    addEventListener('pointerup',end);
    addEventListener('pointercancel',end);
    // while dragging, keep the page from scrolling under the finger
    addEventListener('touchmove',block,{passive:false});
  }
  function bind(){
    pool.querySelectorAll('.item').forEach(item=>{
      item.onpointerdown=e=>{
        if(e.button>0)return;
        // a finger on the row body waits for a short hold, so a swipe still
        // scrolls the list; a mouse, or a finger on the handle, drags at once
        if(e.pointerType==='touch'&&!e.target.closest('.grip')){
          const y0=e.clientY;
          const stop=()=>{clearTimeout(t);removeEventListener('pointermove',early);removeEventListener('pointerup',stop);removeEventListener('pointercancel',stop)};
          const early=ev=>{if(Math.abs(ev.clientY-y0)>8)stop()};
          const t=setTimeout(()=>{stop();begin(item)},220);
          addEventListener('pointermove',early);
          addEventListener('pointerup',stop);
          addEventListener('pointercancel',stop);
        }else{
          e.preventDefault();
          begin(item);
        }
      };
    });
  }
  function draw(){
    pool.innerHTML=cur.map((i,pos)=>`<div class="item drag" data-i="${i}"><span class="n grip">${pos+1}</span><span>${esc(steps[i][0])}</span></div>`).join('');
    bind();
  }
  function check(){
    let right=0;
    pool.innerHTML=cur.map((i,pos)=>{const ok=i==pos;if(ok)right++;return `<div class="item ${ok?'ok':'no'}"><span class="n${ok?'':' wrong'}">${i+1}</span><span>${steps[i][1]?`<strong>${esc(steps[i][0])}</strong><span class="tag">critical</span>`:esc(steps[i][0])}</span></div>`}).join('');
    out.innerHTML=`<p class="score">${right}/${steps.length} in the right position</p><details><summary>Correct order</summary><ol>${steps.map(s=>`<li>${s[1]?`<strong>${esc(s[0])}</strong><span class="tag">critical</span>`:esc(s[0])}</li>`).join('')}</ol></details>`;
    document.getElementById('chk').disabled=true;
  }
  document.getElementById('chk').onclick=check;
  document.getElementById('again').onclick=order;
  document.getElementById('new').onclick=drill;
  draw();
}

function crit(){
  const steps=S[skill][1];let sel=new Set();
  app.innerHTML=`<p class="qtype">Critical Steps</p><h2>${esc(S[skill][0])}</h2><p class="hint">Skill ${skill+1}. Select every step you think is a critical element step (missing one fails the skill). Some skills have just one.</p><div class="list" id="l"></div><div id="out"></div><div class="row"><button class="b p" id="chk">Submit</button><button class="b" id="new">Next</button></div>`;
  const l=document.getElementById('l');
  l.innerHTML=steps.map((s,i)=>`<button class="item" data-i="${i}"><span class="n">${i+1}</span><span>${esc(s[0])}</span></button>`).join('');
  l.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')});
  document.getElementById('chk').onclick=()=>{
    let hit=0,miss=0,fp=0;
    l.querySelectorAll('.item').forEach(b=>{const i=+b.dataset.i,c=!!steps[i][1],s=sel.has(i);b.classList.remove('sel');b.style.pointerEvents='none';
      if(c&&s){b.classList.add('ok');hit++}else if(c){b.classList.add('miss');miss++}else if(s){b.classList.add('no');fp++}
      if(c){const t=b.querySelector('span:last-child');t.innerHTML=`<strong>${t.innerHTML}</strong><span class="tag">critical</span>`}});
    document.getElementById('out').innerHTML=`<p class="score">${hit} found · ${miss} missed · ${fp} wrongly marked</p><p class="hint">Green = got it, yellow = missed critical step, red = not critical.</p>`;
    document.getElementById('chk').disabled=true;
  };
  document.getElementById('new').onclick=drill;
}

function review(){
  const n=sk=>sk[1].filter(x=>x[1]).length;
  const stepList=(sk,cls)=>`<ol class="revl${cls||''}">${sk[1].map(st=>`<li>${st[1]?`<strong><em>${esc(st[0])}</em></strong><span class="tag">critical</span>`:esc(st[0])}</li>`).join('')}</ol>`;
  const seg=`<div class="seg"><button class="sb${revView==='focus'?' on':''}" id="vf">Focus</button><button class="sb${revView==='list'?' on':''}" id="vl">List</button></div>`;
  const pick=revView==='focus'
    ? `<select id="pick" aria-label="Jump to skill">${S.map((sk,i)=>`<option value="${i}"${i===revIdx?' selected':''}>${i+1}. ${esc(sk[0])}</option>`).join('')}</select>`
    : '';
  const ctl=`<div class="row ctl">${seg}${pick}</div>`;
  if(revView==='focus'){
    const sk=S[revIdx],c=n(sk);
    const vid=V[revIdx];
    const video=vid
      ? `<h3 class="vh">Video walkthrough</h3><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="${esc(sk[0])} walkthrough" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><p class="vcred">Video by XY Nursing Skills, not affiliated with Credentia · <a href="https://www.youtube.com/watch?v=${vid}&list=${PL}" target="_blank" rel="noopener noreferrer">Watch on YouTube</a></p>`
      : (PROV[prov].videos
          ? `<p class="vcred">This playlist has no walkthrough for skill ${revIdx+1} · <a href="https://www.youtube.com/playlist?list=${PL}" target="_blank" rel="noopener noreferrer">browse it on YouTube</a></p>`
          : '');
    app.innerHTML=ctl+`<p class="hint">Skill ${revIdx+1} of ${S.length} · ${sk[1].length} steps${c?` · ${c} critical`:' · none flagged critical'}</p><h2>${esc(sk[0])}</h2>`+stepList(sk,' focus')+video+
      `<div class="row"><button class="b" id="prev">← Previous</button><button class="b" id="next">Next →</button></div>`;
    document.getElementById('prev').onclick=()=>{revIdx=(revIdx-1+S.length)%S.length;review()};
    document.getElementById('next').onclick=()=>{revIdx=(revIdx+1)%S.length;review()};
  }else{
    app.innerHTML=ctl+`<p class="hint">All ${S.length} skills with their steps in order. Critical element steps are tagged — missing one fails the skill.</p><div class="row"><button class="b" id="exp">Expand all</button><button class="b" id="col">Collapse all</button></div>`+
      S.map((sk,i)=>`<details class="rev"><summary><strong>${i+1}. ${esc(sk[0])}</strong><span class="cnt">${sk[1].length} steps${n(sk)?` · ${n(sk)} critical`:''}</span></summary>${stepList(sk)}</details>`).join('');
    const all=o=>app.querySelectorAll('details.rev').forEach(d=>d.open=o);
    document.getElementById('exp').onclick=()=>all(true);
    document.getElementById('col').onclick=()=>all(false);
  }
  const pk=document.getElementById('pick');
  if(pk)pk.onchange=e=>{revIdx=+e.target.value;review()};
  document.getElementById('vf').onclick=()=>{revView='focus';review()};
  document.getElementById('vl').onclick=()=>{revView='list';review()};
}
chrome();
render();
</script>
